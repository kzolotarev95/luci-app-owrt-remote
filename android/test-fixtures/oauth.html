<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture OAuth callback</title></head><body><h1 id="oauthTitle">Fixture OAuth popup</h1><p>Local simulation only; no provider is contacted.</p><button id="oauthComplete" onclick="if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'owrt-social-linked',provider:'fixture',ok:true},location.origin);setTimeout(()=>window.close(),250)}else document.querySelector('#oauthStatus').textContent='No opener: popup integration failed'">Complete callback</button><p id="oauthStatus"></p></body></html>
