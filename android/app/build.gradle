plugins { id 'com.android.application' }

android {
    namespace 'ru.owrthub.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.owrthub.app'
        minSdk 26
        targetSdk 35
        versionCode 23
        versionName '0.3.13-v125'
        testInstrumentationRunner project.hasProperty('nativeSecurity')
                ? 'ru.owrthub.app.NativeDeviceSecurityInstrumentation' : project.hasProperty('nativeRedesign')
                ? 'ru.owrthub.app.NativeRedesignInstrumentation' : project.hasProperty('nativeAudit')
                ? 'ru.owrthub.app.NativeAuditInstrumentation' : 'ru.owrthub.app.NativeSmokeInstrumentation'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            if (rootProject.file('.signing/debug.keystore').exists()) {
                storeFile rootProject.file('.signing/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
